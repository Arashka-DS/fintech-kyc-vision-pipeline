version: '3.8'

services:
  postgres_kyc:
    image: postgres:15-alpine
    container_name: kyc_db
    environment:
      POSTGRES_USER: kyc_admin
      POSTGRES_PASSWORD: kyc_password
      POSTGRES_DB: kyc_warehouse
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_kyc_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc_admin -d kyc_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  kyc_api:
    build: .
    container_name: kyc_fastapi
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres_kyc
      - DB_USER=kyc_admin
      - DB_PASSWORD=kyc_password
      - DB_NAME=kyc_warehouse
    volumes:
      - ./src:/app/src
    command: micromamba run -n base uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres_kyc:
        condition: service_healthy

  kyc_ui:
    build: .
    container_name: kyc_streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://kyc_api:8000
    volumes:
      - ./frontend:/app/frontend
    command: micromamba run -n base streamlit run frontend/app.py --server.address 0.0.0.0
    depends_on:
      - kyc_api

  metabase:
    image: metabase/metabase:latest
    container_name: kyc_metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=kyc_warehouse
      - MB_DB_PORT=5432
      - MB_DB_USER=kyc_admin
      - MB_DB_PASS=kyc_password
      - MB_DB_HOST=postgres_kyc
    depends_on:
      postgres_kyc:
        condition: service_healthy

volumes:
  pg_kyc_data:
